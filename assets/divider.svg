<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24" fill="none" role="presentation">
  <style>
    .dot { animation: move 5s cubic-bezier(.6, 0, .4, 1) infinite alternate; }
    @keyframes move { from { transform: translateX(0); } to { transform: translateX(960px); } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0"/><stop offset=".2" stop-color="#6366f1"/><stop offset=".5" stop-color="#ec4899"/><stop offset=".8" stop-color="#f59e0b"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="0" y="11" width="1000" height="2" rx="1" fill="url(#line)" opacity=".7"/>
  <circle class="dot" cx="20" cy="12" r="10" fill="url(#glow)"/>
</svg>
