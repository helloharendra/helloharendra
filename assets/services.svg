<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="344" viewBox="0 0 1000 344" fill="none" role="img" aria-label="Services: business software, mobile apps, e-commerce, education software, SaaS and backend, AI and automation">
  <style>
    * { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .up { opacity: 0; animation: up .8s cubic-bezier(.2, .8, .2, 1) forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .d1 { animation-delay: .05s; } .d2 { animation-delay: .2s; } .d3 { animation-delay: .35s; }
    .d4 { animation-delay: .5s; } .d5 { animation-delay: .65s; } .d6 { animation-delay: .8s; }
    .icon { transform-box: fill-box; transform-origin: center; animation: bob 4s ease-in-out infinite; }
    .i2 { animation-delay: -.7s; } .i3 { animation-delay: -1.4s; } .i4 { animation-delay: -2.1s; } .i5 { animation-delay: -2.8s; } .i6 { animation-delay: -3.5s; }
    @keyframes bob { 50% { transform: translateY(-5px); } }
    .bar { transform-box: fill-box; transform-origin: left; animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scaleX(.35); } 50% { transform: scaleX(1); } }
    .sweep { animation: sweep 7s ease-in-out 1.5s infinite; }
    @keyframes sweep { 0% { transform: translateX(-300px); } 50%, 100% { transform: translateX(1300px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; } }
  </style>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141a33"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset=".5" stop-color="#ec4899"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="cards">
      <rect x="1" y="2" width="318" height="160" rx="18"/><rect x="341" y="2" width="318" height="160" rx="18"/><rect x="681" y="2" width="318" height="160" rx="18"/>
      <rect x="1" y="182" width="318" height="160" rx="18"/><rect x="341" y="182" width="318" height="160" rx="18"/><rect x="681" y="182" width="318" height="160" rx="18"/>
    </clipPath>
  </defs>

  <!-- Row 1 -->
  <g transform="translate(1 2)"><g class="up d1">
    <rect width="318" height="160" rx="18" fill="url(#card)" stroke="#818cf8" stroke-opacity=".22"/>
    <rect class="bar" x="24" y="0" width="90" height="3" rx="1.5" fill="url(#accent)"/>
    <g class="icon"><circle cx="46" cy="50" r="24" fill="#6366f1" fill-opacity=".18"/><g transform="translate(34 38)" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4M10 10h4M10 14h4M10 18h4"/></g></g>
    <text x="84" y="57" fill="#f8fafc" font-size="19" font-weight="700">Business Software</text>
    <text x="24" y="106" fill="#94a3b8" font-size="14">ERP, CRM, POS billing, inventory,</text>
    <text x="24" y="128" fill="#94a3b8" font-size="14">HR &amp; custom business systems</text>
  </g></g>
  <g transform="translate(341 2)"><g class="up d2">
    <rect width="318" height="160" rx="18" fill="url(#card)" stroke="#818cf8" stroke-opacity=".22"/>
    <rect class="bar" x="24" y="0" width="90" height="3" rx="1.5" fill="url(#accent)"/>
    <g class="icon i2"><circle cx="46" cy="50" r="24" fill="#ec4899" fill-opacity=".16"/><g transform="translate(34 38)" stroke="#f9a8d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="5" y="2" width="14" height="20" rx="2.5"/><path d="M12 18h.01"/></g></g>
    <text x="84" y="57" fill="#f8fafc" font-size="19" font-weight="700">Mobile Apps</text>
    <text x="24" y="106" fill="#94a3b8" font-size="14">Flutter apps for Android &amp; iOS —</text>
    <text x="24" y="128" fill="#94a3b8" font-size="14">customer, vendor, rider &amp; admin</text>
  </g></g>
  <g transform="translate(681 2)"><g class="up d3">
    <rect width="318" height="160" rx="18" fill="url(#card)" stroke="#818cf8" stroke-opacity=".22"/>
    <rect class="bar" x="24" y="0" width="90" height="3" rx="1.5" fill="url(#accent)"/>
    <g class="icon i3"><circle cx="46" cy="50" r="24" fill="#f59e0b" fill-opacity=".16"/><g transform="translate(34 38)" stroke="#fcd34d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></g></g>
    <text x="84" y="57" fill="#f8fafc" font-size="19" font-weight="700">E-commerce</text>
    <text x="24" y="106" fill="#94a3b8" font-size="14">Online stores, multi-vendor</text>
    <text x="24" y="128" fill="#94a3b8" font-size="14">marketplaces, grocery &amp; food delivery</text>
  </g></g>

  <!-- Row 2 -->
  <g transform="translate(1 182)"><g class="up d4">
    <rect width="318" height="160" rx="18" fill="url(#card)" stroke="#818cf8" stroke-opacity=".22"/>
    <rect class="bar" x="24" y="0" width="90" height="3" rx="1.5" fill="url(#accent)"/>
    <g class="icon i4"><circle cx="46" cy="50" r="24" fill="#06b6d4" fill-opacity=".16"/><g transform="translate(34 38)" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/><path d="M22 10v6"/></g></g>
    <text x="84" y="57" fill="#f8fafc" font-size="19" font-weight="700">Education Software</text>
    <text x="24" y="106" fill="#94a3b8" font-size="14">School, college &amp; coaching ERP,</text>
    <text x="24" y="128" fill="#94a3b8" font-size="14">fee management &amp; LMS platforms</text>
  </g></g>
  <g transform="translate(341 182)"><g class="up d5">
    <rect width="318" height="160" rx="18" fill="url(#card)" stroke="#818cf8" stroke-opacity=".22"/>
    <rect class="bar" x="24" y="0" width="90" height="3" rx="1.5" fill="url(#accent)"/>
    <g class="icon i5"><circle cx="46" cy="50" r="24" fill="#8b5cf6" fill-opacity=".18"/><g transform="translate(34 38)" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></g></g>
    <text x="84" y="57" fill="#f8fafc" font-size="19" font-weight="700">SaaS &amp; Backend</text>
    <text x="24" y="106" fill="#94a3b8" font-size="14">SaaS products, FastAPI &amp; Node.js</text>
    <text x="24" y="128" fill="#94a3b8" font-size="14">APIs, cloud deployment &amp; scaling</text>
  </g></g>
  <g transform="translate(681 182)"><g class="up d6">
    <rect width="318" height="160" rx="18" fill="url(#card)" stroke="#818cf8" stroke-opacity=".22"/>
    <rect class="bar" x="24" y="0" width="90" height="3" rx="1.5" fill="url(#accent)"/>
    <g class="icon i6"><circle cx="46" cy="50" r="24" fill="#10b981" fill-opacity=".16"/><g transform="translate(34 38)" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="3" y="11" width="18" height="10" rx="2.5"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4M8.5 15.5v1.5M15.5 15.5v1.5"/></g></g>
    <text x="84" y="57" fill="#f8fafc" font-size="19" font-weight="700">AI &amp; Automation</text>
    <text x="24" y="106" fill="#94a3b8" font-size="14">AI features, analytics, computer</text>
    <text x="24" y="128" fill="#94a3b8" font-size="14">vision &amp; workflow automation</text>
  </g></g>

  <g clip-path="url(#cards)"><rect class="sweep" x="0" y="-40" width="220" height="430" fill="url(#streak)" transform="skewX(-20)"/></g>
</svg>
