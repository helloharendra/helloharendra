<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" fill="none" role="img" aria-label="Harendra Prajapati – Full-Stack Software Engineer and Founder of Naya Prayog Technologies">
  <style>
    * { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono, .mono text, .mono tspan { font-family: 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .orb { transform-box: fill-box; transform-origin: center; animation: float 14s ease-in-out infinite alternate; }
    .o2 { animation-duration: 18s; animation-delay: -5s; }
    .o3 { animation-duration: 16s; animation-delay: -9s; }
    @keyframes float { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(70px, -30px) scale(1.15); } 100% { transform: translate(-50px, 25px) scale(.92); } }
    .up { opacity: 0; animation: up .9s cubic-bezier(.2, .8, .2, 1) forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .5s; } .d4 { animation-delay: .7s; }
    .d5 { animation-delay: .9s; } .d6 { animation-delay: 1.05s; } .d7 { animation-delay: 1.2s; } .d8 { animation-delay: 1.35s; } .d9 { animation-delay: 1.5s; }
    .grow { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.2s .7s cubic-bezier(.2, .8, .2, 1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 2s ease-out infinite; }
    @keyframes ring { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(2.8); opacity: 0; } }
    .bob { animation: bob 6s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-8px); } }
    .cover { transform-box: fill-box; transform-origin: right; animation: reveal .8s steps(20) forwards; }
    .l1 { animation-delay: .9s; } .l2 { animation-delay: 1.7s; } .l3 { animation-delay: 2.5s; } .l4 { animation-delay: 3.3s; } .l5 { animation-delay: 4.1s; }
    @keyframes reveal { to { transform: scaleX(0); } }
    .cursor { opacity: 0; animation: blink 1s step-end 4.9s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .shine { animation: shine 7s ease-in-out 2s infinite; }
    @keyframes shine { 0% { transform: translateX(-400px); } 45%, 100% { transform: translateX(1400px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; } .cover { display: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070b18"/><stop offset=".55" stop-color="#151436"/><stop offset="1" stop-color="#26206b"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#e0e7ff"/><stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/><stop offset=".5" stop-color="#ec4899"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#6366f1" stop-opacity=".75"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#ec4899" stop-opacity=".5"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3"><stop offset="0" stop-color="#06b6d4" stop-opacity=".45"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#ffffff" stroke-opacity=".05"/></pattern>
    <clipPath id="card"><rect width="1000" height="330" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="330" fill="url(#bg)"/>
    <circle class="orb" cx="180" cy="60" r="220" fill="url(#g1)"/>
    <circle class="orb o2" cx="820" cy="300" r="240" fill="url(#g2)"/>
    <circle class="orb o3" cx="560" cy="40" r="180" fill="url(#g3)"/>
    <rect width="1000" height="330" fill="url(#grid)"/>
    <rect class="shine" x="0" y="-50" width="260" height="430" fill="url(#streak)" transform="skewX(-20)"/>
    <rect x=".5" y=".5" width="999" height="329" rx="23.5" stroke="#ffffff" stroke-opacity=".08"/>
  </g>

  <!-- availability pill -->
  <g class="up d1">
    <rect x="50" y="42" width="232" height="32" rx="16" fill="#10b981" fill-opacity=".12" stroke="#10b981" stroke-opacity=".45"/>
    <circle class="ring" cx="70" cy="58" r="5" fill="#10b981"/>
    <circle cx="70" cy="58" r="5" fill="#34d399"/>
    <text x="84" y="63" fill="#a7f3d0" font-size="13.5" font-weight="600">Available for new projects</text>
  </g>

  <text class="up d2" x="48" y="130" fill="url(#name)" font-size="48" font-weight="800" letter-spacing="-1">Harendra Prajapati</text>
  <rect class="grow" x="50" y="146" width="190" height="4" rx="2" fill="url(#accent)"/>
  <text class="up d3" x="50" y="184" fill="#ffffff" font-size="21" font-weight="700">Expert Full-Stack Developer</text>
  <text class="up d3" x="50" y="210" font-size="16" font-weight="600"><tspan fill="#c7d2fe">Software Engineer</tspan><tspan fill="#818cf8">  ·  </tspan><tspan fill="#f9a8d4">AI Engineer</tspan></text>
  <text class="up d4" x="50" y="234" fill="#94a3b8" font-size="15">Founder, Naya Prayog Technologies</text>

  <!-- capability chips -->
  <g font-size="13" font-weight="600">
    <g class="up d5"><rect x="50" y="256" width="92" height="30" rx="15" fill="#6366f1" fill-opacity=".18" stroke="#818cf8" stroke-opacity=".5"/><text x="96" y="276" text-anchor="middle" fill="#c7d2fe">Web Apps</text></g>
    <g class="up d6"><rect x="150" y="256" width="108" height="30" rx="15" fill="#ec4899" fill-opacity=".15" stroke="#f472b6" stroke-opacity=".5"/><text x="204" y="276" text-anchor="middle" fill="#fbcfe8">Mobile Apps</text></g>
    <g class="up d7"><rect x="266" y="256" width="64" height="30" rx="15" fill="#06b6d4" fill-opacity=".15" stroke="#22d3ee" stroke-opacity=".5"/><text x="298" y="276" text-anchor="middle" fill="#a5f3fc">SaaS</text></g>
    <g class="up d8"><rect x="338" y="256" width="98" height="30" rx="15" fill="#f59e0b" fill-opacity=".15" stroke="#fbbf24" stroke-opacity=".5"/><text x="387" y="276" text-anchor="middle" fill="#fde68a">ERP &amp; CRM</text></g>
    <g class="up d9"><rect x="444" y="256" width="94" height="30" rx="15" fill="#10b981" fill-opacity=".15" stroke="#34d399" stroke-opacity=".5"/><text x="491" y="276" text-anchor="middle" fill="#a7f3d0">AI &amp; Data</text></g>
  </g>

  <!-- code window -->
  <g class="bob">
    <g class="up d4">
      <rect x="590" y="58" width="364" height="216" rx="16" fill="#0b1224" stroke="#ffffff" stroke-opacity=".12"/>
      <path d="M590 74a16 16 0 0 1 16-16h332a16 16 0 0 1 16 16v20H590z" fill="#ffffff" fill-opacity=".04"/>
      <circle cx="612" cy="77" r="5.5" fill="#f87171"/><circle cx="632" cy="77" r="5.5" fill="#fbbf24"/><circle cx="652" cy="77" r="5.5" fill="#34d399"/>
      <text class="mono" x="772" y="81" text-anchor="middle" fill="#64748b" font-size="12">naya-prayog.ts</text>

      <g class="mono" font-size="14">
        <text x="614" y="128"><tspan fill="#c084fc">const</tspan><tspan fill="#e2e8f0"> studio = {</tspan></text>
        <text x="614" y="156"><tspan fill="#7dd3fc" x="639">stack</tspan><tspan fill="#e2e8f0">: [</tspan><tspan fill="#86efac">'Web'</tspan><tspan fill="#e2e8f0">,</tspan><tspan fill="#86efac">'App'</tspan><tspan fill="#e2e8f0">,</tspan><tspan fill="#86efac">'SaaS'</tspan><tspan fill="#e2e8f0">,</tspan><tspan fill="#86efac">'AI'</tspan><tspan fill="#e2e8f0">],</tspan></text>
        <text x="614" y="184"><tspan fill="#7dd3fc" x="639">delivery</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#86efac">'end-to-end'</tspan><tspan fill="#e2e8f0">,</tspan></text>
        <text x="614" y="212"><tspan fill="#7dd3fc" x="639">available</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#fbbf24">true</tspan></text>
        <text x="614" y="240"><tspan fill="#e2e8f0">};</tspan></text>
      </g>
      <!-- typing reveal covers -->
      <g fill="#0b1224">
        <rect class="cover l1" x="608" y="110" width="336" height="26"/>
        <rect class="cover l2" x="608" y="138" width="336" height="26"/>
        <rect class="cover l3" x="608" y="166" width="336" height="26"/>
        <rect class="cover l4" x="608" y="194" width="336" height="26"/>
        <rect class="cover l5" x="608" y="222" width="336" height="26"/>
      </g>
      <rect class="cursor" x="637" y="227" width="8" height="17" rx="1" fill="#a5b4fc"/>
    </g>
  </g>
</svg>
